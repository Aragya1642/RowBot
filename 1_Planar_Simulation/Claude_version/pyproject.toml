[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "usv-seakeeper"
version = "0.1.0"
description = "USV surge/heave/pitch simulator with a pluggable controller interface and Gymnasium environments"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.6"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3[extra]>=2.2"]

[tool.setuptools]
packages = ["usv_seakeeper"]
